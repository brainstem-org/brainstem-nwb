[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "brainstem-nwb"
dynamic = ["version"]
description = "Export BrainSTEM experimental metadata to Neurodata Without Borders (NWB) files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BrainSTEM Team" }]
keywords = ["neuroscience", "nwb", "brainstem", "metadata", "electronic lab notebook", "dandi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pynwb>=4.0,<5",
    "nwbinspector>=0.7",
    "pydantic>=2.6",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
    # export_project()/export_session() are in brainstem_python_api_tools 2.1.0 and later.
    "brainstem_python_api_tools>=2.1",
    "requests>=2.28",
]

[project.optional-dependencies]
extensions = ["ndx-brainstem>=0.2,<0.3"]
neuroconv = ["neuroconv[ecephys-minimal]>=0.10"]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4.18", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
brainstem-nwb = "brainstem_nwb.cli:main"

[project.urls]
Homepage = "https://github.com/brainstem-org/brainstem-nwb"
Documentation = "https://github.com/brainstem-org/brainstem-nwb/tree/main/docs"
Issues = "https://github.com/brainstem-org/brainstem-nwb/issues"

[tool.hatch.version]
path = "src/brainstem_nwb/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brainstem_nwb"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "schemas", "examples", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end runs over the modality fixtures",
    "network: talks to a live BrainSTEM server (opt-in, needs BRAINSTEM_API_TOKEN)",
]
filterwarnings = ["ignore::DeprecationWarning:hdmf.*", "ignore::DeprecationWarning:pynwb.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
packages = ["brainstem_nwb"]
mypy_path = "src"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
